name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: international_trade_test
          POSTGRES_PASSWORD: payload
          POSTGRES_USER: payload
        options: >-
          --health-cmd "pg_isready -U payload -d international_trade_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://payload:payload@127.0.0.1:5432/international_trade_test
      PAYLOAD_DB_PUSH: 'false'
      S3_ACCESS_KEY_ID: minioadmin
      S3_BUCKET: international-trade-ci-test
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_FORCE_PATH_STYLE: 'true'
      S3_PUBLIC_URL: http://127.0.0.1:9000/international-trade-ci-test
      S3_REGION: us-east-1
      S3_SECRET_ACCESS_KEY: minioadmin

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22.17.0

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Start isolated object storage
        run: |
          docker run --detach --name minio-ci \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-07-18T21-56-31Z server /data
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:9000/minio/health/live

      - name: Unit and integration tests
        run: pnpm test:int

      - name: Migration from an empty PostgreSQL schema
        run: pnpm db:migrate

      - name: Create smoke-test bucket
        run: |
          docker run --rm --network host --entrypoint /bin/sh minio/mc:RELEASE.2025-07-16T15-35-03Z -ec '
            mc alias set local http://127.0.0.1:9000 minioadmin minioadmin
            mc mb --ignore-existing local/international-trade-ci-test
          '

      - name: Install fixed Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright and axe
        run: pnpm test:e2e

      - name: Production blank build
        env:
          CRON_SECRET: ci-cron-secret-at-least-24-characters
          LIBRETRANSLATE_URL: http://127.0.0.1:5000
          NODE_ENV: production
          PAYLOAD_SECRET: ci-payload-secret-at-least-32-characters-long
          PREVIEW_SECRET: ci-preview-secret-at-least-24-characters
          REDIS_URL: redis://127.0.0.1:6379
          S3_PUBLIC_URL: https://assets.ci.invalid
          SITE_URL: https://ci.invalid
          SMTP_FROM_ADDRESS: ci@ci.invalid
          SMTP_FROM_NAME: CI
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: '2525'
          SMTP_SKIP_VERIFY: 'true'
          SITE_VARIANT: blank
          TRUST_PROXY_HEADERS: 'true'
        run: pnpm build

      - name: Production blank smoke
        env:
          CRON_SECRET: ci-cron-secret-at-least-24-characters
          LIBRETRANSLATE_URL: http://127.0.0.1:5000
          NODE_ENV: production
          PAYLOAD_SECRET: ci-payload-secret-at-least-32-characters-long
          PREVIEW_SECRET: ci-preview-secret-at-least-24-characters
          REDIS_URL: redis://127.0.0.1:6379
          S3_PUBLIC_URL: https://assets.ci.invalid
          SITE_URL: https://ci.invalid
          SMTP_FROM_ADDRESS: ci@ci.invalid
          SMTP_FROM_NAME: CI
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: '2525'
          SMTP_SKIP_VERIFY: 'true'
          SITE_VARIANT: blank
          TRUST_PROXY_HEADERS: 'true'
        run: |
          pnpm start > /tmp/app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; cat /tmp/app.log' EXIT
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:3000/api/health/live && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/api/health/ready
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/)" = "307"

      - name: Production demo build
        env:
          CRON_SECRET: ci-cron-secret-at-least-24-characters
          LIBRETRANSLATE_URL: http://127.0.0.1:5000
          NODE_ENV: production
          PAYLOAD_SECRET: ci-payload-secret-at-least-32-characters-long
          PREVIEW_SECRET: ci-preview-secret-at-least-24-characters
          REDIS_URL: redis://127.0.0.1:6379
          S3_PUBLIC_URL: https://assets.ci.invalid
          SITE_URL: https://ci.invalid
          SITE_VARIANT: demo
          SMTP_FROM_ADDRESS: ci@ci.invalid
          SMTP_FROM_NAME: CI
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: '2525'
          SMTP_SKIP_VERIFY: 'true'
          TRUST_PROXY_HEADERS: 'true'
        run: pnpm build

      - name: Production demo smoke
        env:
          CRON_SECRET: ci-cron-secret-at-least-24-characters
          LIBRETRANSLATE_URL: http://127.0.0.1:5000
          NODE_ENV: production
          PAYLOAD_SECRET: ci-payload-secret-at-least-32-characters-long
          PREVIEW_SECRET: ci-preview-secret-at-least-24-characters
          REDIS_URL: redis://127.0.0.1:6379
          S3_PUBLIC_URL: https://assets.ci.invalid
          SITE_URL: https://ci.invalid
          SITE_VARIANT: demo
          SMTP_FROM_ADDRESS: ci@ci.invalid
          SMTP_FROM_NAME: CI
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: '2525'
          SMTP_SKIP_VERIFY: 'true'
          TRUST_PROXY_HEADERS: 'true'
        run: |
          pnpm start > /tmp/app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; cat /tmp/app.log' EXIT
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:3000/api/health/live && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/api/health/ready
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/)" = "307"

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
