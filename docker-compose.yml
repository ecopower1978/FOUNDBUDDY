name: international-trade-local

services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: international_trade_dev
      POSTGRES_PASSWORD: payload
      POSTGRES_USER: payload
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload -d international_trade_dev']
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8.0.3-alpine
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:RELEASE.2025-07-18T21-56-31Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_ROOT_USER: minioadmin
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-07-16T15-35-03Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/international-trade-dev
        mc anonymous set download local/international-trade-dev

  libretranslate:
    image: libretranslate/libretranslate:v1.9.6
    profiles: ['translation']
    environment:
      LT_DISABLE_WEB_UI: 'true'
      LT_LOAD_ONLY: en,es,ar,de,he,ko,pt,zh
    ports:
      - '5000:5000'

volumes:
  minio_data:
  postgres_data:
  redis_data:
